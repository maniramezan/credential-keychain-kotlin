name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kotlin-lint:
    name: Kotlin lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew ktlintCheck --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-lint-reports
          path: build/reports/ktlint/
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Linux real-store and coverage checks
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/linux-keychain-tests.sh ./gradlew jvmCoverageVerification --stacktrace
      - name: macOS real-store and coverage checks
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" = arm64 ]; then native_test=macosArm64Test; else native_test=macosX64Test; fi
          bash scripts/macos-keychain-tests.sh ./gradlew jvmCoverageVerification "$native_test" --stacktrace
      - name: Windows real-store and coverage checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon jvmCoverageVerification --stacktrace
        env:
          CREDENTIAL_KEYCHAIN_INTEGRATION: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-reports-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
  multiplatform:
    name: Apple, web, API, and publications
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Compile all targets and verify web, ABI, and docs
        run: ./gradlew assemble jsNodeTest wasmJsNodeTest checkKotlinAbi dokkaGeneratePublicationHtml --stacktrace
      - name: Publish artifacts to an isolated verification repository
        run: ./gradlew publishAllPublicationsToVerificationRepository
      - name: Check the artifact set
        run: python3 scripts/verify-artifacts.py build/verification-repository
      - name: Compile a separate consumer using published metadata
        run: ./gradlew -p verification/consumer assemble -PverificationRepository="$GITHUB_WORKSPACE/build/verification-repository"
      - name: Verify Swift error propagation using the published library
        run: bash scripts/swift-interop-tests.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: multiplatform-reports
          path: |
            build/reports/
            build/test-results/
            build/kotlin/abi/
            build/dokka/html/
  android:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedAndroidDeviceTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports-${{ matrix.api }}
          path: |
            build/reports/
            build/outputs/androidTest-results/
  workflow-lint:
    name: Workflow and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
      - run: bash -n scripts/*.sh
      - run: python3 -m unittest discover -s scripts/tests
  required-checks:
    name: Required checks
    if: always()
    needs: [kotlin-lint, desktop, multiplatform, android, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Verification did not pass: ' + ', '.join(failed))
          PYTHON
