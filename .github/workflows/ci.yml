name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Linux real-store and coverage checks
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/linux-keychain-tests.sh ./gradlew jvmCoverageVerification --stacktrace
      - name: macOS real-store and coverage checks
        if: runner.os == 'macOS'
        run: bash scripts/macos-keychain-tests.sh ./gradlew jvmCoverageVerification --stacktrace
      - name: Windows real-store and coverage checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon jvmCoverageVerification --stacktrace
        env:
          CREDENTIAL_KEYCHAIN_INTEGRATION: '1'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: desktop-reports-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
  multiplatform:
    name: Apple, web, API, and publications
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile all targets and verify native storage, web, ABI, and docs
        run: bash scripts/macos-keychain-tests.sh ./gradlew assemble macosArm64Test jsNodeTest wasmJsNodeTest checkKotlinAbi dokkaGeneratePublicationHtml --stacktrace
      - name: Publish artifacts to an isolated verification repository
        run: ./gradlew publishAllPublicationsToVerificationRepository
      - name: Check the artifact set
        run: python3 scripts/verify-artifacts.py build/verification-repository
      - name: Compile a separate consumer using published metadata
        run: ./gradlew -p verification/consumer assemble -PverificationRepository="$GITHUB_WORKSPACE/build/verification-repository"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: multiplatform-reports
          path: |
            build/reports/
            build/test-results/
            build/kotlin/abi/
            build/dokka/html/
  android:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: ./gradlew connectedAndroidDeviceTest --stacktrace
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-reports-${{ matrix.api }}
          path: |
            build/reports/
            build/outputs/androidTest-results/
  workflow-lint:
    name: Workflow and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
      - run: bash -n scripts/macos-keychain-tests.sh scripts/linux-keychain-tests.sh
      - run: python3 -m unittest discover -s scripts/tests
