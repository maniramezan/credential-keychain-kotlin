name: Stage Maven Central release
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: maven-central-release
  cancel-in-progress: false
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require a release tag matching the checked-in version
        run: |
          python3 - <<'PY'
          import os, runpy
          version = runpy.run_path('scripts/verify-artifacts.py')['version_from_properties']()
          if version.endswith('-SNAPSHOT') or os.environ['GITHUB_REF'] != f'refs/tags/v{version}':
              raise SystemExit('Run this workflow on a vVERSION_NAME release tag, not a branch or snapshot.')
          PY
  verify:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
  stage:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and validate signed artifacts before upload
        run: |
          ./gradlew -PreleaseSigning=true publishAllPublicationsToVerificationRepository
          python3 scripts/verify-artifacts.py build/verification-repository --signed
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      - name: Stage for manual publication in Central Portal
        run: ./gradlew -PreleaseSigning=true publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
