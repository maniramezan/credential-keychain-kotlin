name: Stage Maven Central release
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: maven-central-release
  cancel-in-progress: false
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a release tag matching the checked-in version
        run: |
          python3 - <<'PY'
          import os, runpy
          version = runpy.run_path('scripts/verify-artifacts.py')['version_from_properties']()
          if version.endswith('-SNAPSHOT') or os.environ['GITHUB_REF'] != f'refs/tags/{version}':
              raise SystemExit('Run this workflow on a VERSION_NAME release tag (no v prefix), not a branch or snapshot.')
          PY
  verify:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
  stage:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default also requests the legacy 'tools' package, which Google removed.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build and validate signed artifacts before upload
        run: |
          ./gradlew -PreleaseSigning=true publishAllPublicationsToVerificationRepository
          python3 scripts/verify-artifacts.py build/verification-repository --signed
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      - name: Stage for manual publication in Central Portal
        run: ./gradlew -PreleaseSigning=true publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
