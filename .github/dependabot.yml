version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /verification/consumer
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
